app-id: io.github.rodolfoaltenrath.photo-axia
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: axia

sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --env=GTK_USE_PORTAL=1
  - --filesystem=home

modules:
  - name: axia
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/golang/bin
      env:
        CGO_ENABLED: "1"
        GOFLAGS: -mod=vendor
        GOTOOLCHAIN: local
    build-commands:
      - go build -trimpath -tags desktop,production,webkit2_41 -ldflags="-s -w" -o /app/bin/axia .
      - install -Dm644 packaging/flatpak/io.github.rodolfoaltenrath.photo-axia.desktop /app/share/applications/io.github.rodolfoaltenrath.photo-axia.desktop
      - install -Dm644 packaging/flatpak/io.github.rodolfoaltenrath.photo-axia.metainfo.xml /app/share/metainfo/io.github.rodolfoaltenrath.photo-axia.metainfo.xml
      - install -Dm644 packaging/flatpak/io.github.rodolfoaltenrath.photo-axia.png /app/share/icons/hicolor/512x512/apps/io.github.rodolfoaltenrath.photo-axia.png
    sources:
      - type: dir
        path: .
        skip:
          - .flatpak-builder
          - .git
          - .toolchains
          - build/bin
          - builddir
          - dist
          - frontend/node_modules
          - repo
