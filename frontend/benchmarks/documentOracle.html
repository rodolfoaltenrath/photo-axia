<!doctype html>
<meta charset="utf-8">
<title>Axia document compositor oracle</title>
<pre id="result">running</pre>
<script type="module">
import { createDefaultLayerEffect, createLayerStyleConfig } from '../src/editor/layerStyles.ts'
import { LayerStyleUnsupportedEffectError } from '../src/editor/layerStyleCompositor.ts'
import { renderDocumentPNG, renderDocumentBlob, sampleDocumentColor, renderLayerAppearance, renderMergedLayers } from '../src/services/renderDocument.ts'
import { createRustPixelPocRuntime } from '../src/editor/rustPixelPocRuntime.ts'
import wasmUrl from '../src/generated/axia_pixel_core.wasm?url'
import { DEFAULT_TEXT_LAYER } from '../src/editor/text.ts'

const result = document.querySelector('#result')
const width = 8
const height = 6
const light = { angle: 120, altitude: 30 }

function doc(id, background) {
  return {
    id, name: id, width, height, unit: 'px', physicalWidth: width,
    physicalHeight: height, resolutionDpi: 72, colorSpace: 'srgb',
    background, createdAt: '', layerStyleGlobalLight: light
  }
}

function layer(id, kind, content, transform, options = {}) {
  return {
    id, name: id, kind, visible: true, opacity: 100, blendMode: 'normal',
    styles: createLayerStyleConfig(), transform, ...content, ...options
  }
}

function rectangle(id, color, transform, options) {
  return layer(id, 'shape', {
    shape: {
      kind: 'rectangle', color, cornerRadius: 0, squareness: 0,
      starPoints: 5, starInnerRatio: 50,
      baseWidth: transform.width, baseHeight: transform.height
    }
  }, transform, options)
}

function imageUrl(rgba) {
  const canvas = document.createElement('canvas')
  canvas.width = 2
  canvas.height = 2
  const context = canvas.getContext('2d')
  context.putImageData(new ImageData(new Uint8ClampedArray(rgba), 2, 2), 0, 0)
  return canvas.toDataURL('image/png')
}

function imageLayer(id, rgba, options = {}) {
  return layer(id, 'pixel', {
    image: { width: 2, height: 2, mimeType: 'image/png', sourceUrl: imageUrl(rgba) }
  }, { x: 3, y: 2, width: 2, height: 2, rotation: 0 }, options)
}

async function pixelsFromPng(dataUrl, readWidth = width, readHeight = height) {
  const image = new Image()
  image.src = dataUrl
  await image.decode()
  const canvas = document.createElement('canvas')
  canvas.width = readWidth
  canvas.height = readHeight
  const context = canvas.getContext('2d', { willReadFrequently: true })
  context.drawImage(image, 0, 0)
  return [...context.getImageData(0, 0, readWidth, readHeight).data]
}

async function renderCases() {
  const background = layer('background', 'background', {}, undefined)
  const shapeLayers = [
    rectangle('red-multiply', '#ff4020', { x: 2, y: 1, width: 4, height: 3, rotation: 0 },
      { opacity: 65, blendMode: 'multiply' }),
    rectangle('blue-base', '#2060ff', { x: 1, y: 1, width: 4, height: 4, rotation: 0 }),
    background
  ]
  const blendIfStyles = createLayerStyleConfig()
  blendIfStyles.blendIf = {
    channel: 'red', thisLayer: { shadows: [0, 0], highlights: [255, 255] },
    underlyingLayer: { shadows: [64, 192], highlights: [255, 255] }
  }
  const pixelLayers = [
    imageLayer('green-blend-if', [
      20, 220, 50, 255, 20, 220, 50, 255,
      20, 220, 50, 255, 20, 220, 50, 255
    ], { opacity: 80, styles: blendIfStyles }),
    imageLayer('backdrop', [
      0, 30, 200, 255, 64, 30, 200, 255,
      192, 30, 200, 255, 255, 30, 200, 255
    ])
  ]
  const shadow = createDefaultLayerEffect('drop-shadow', 'combo-shadow')
  shadow.useGlobalLight = false
  shadow.angle = 0
  shadow.distance = 2
  shadow.size = 0
  shadow.color = '#0000ff'
  shadow.blendMode = 'normal'
  const overlay = createDefaultLayerEffect('color-overlay', 'combo-overlay')
  overlay.color = '#00ff00'
  overlay.opacity = 60
  const stroke = createDefaultLayerEffect('stroke', 'combo-stroke')
  stroke.size = 1
  stroke.position = 'outside'
  stroke.paint = { type: 'color', color: '#ff0000' }
  const comboStyles = createLayerStyleConfig()
  comboStyles.fillOpacity = 65
  comboStyles.effects = [shadow, overlay, stroke]
  const combinedLayers = [
    imageLayer('styled-pixels', [
      255, 255, 255, 255, 255, 255, 255, 128,
      255, 0, 0, 0, 255, 255, 255, 255
    ], { opacity: 85, styles: comboStyles }),
    rectangle('combo-backdrop', '#203060', { x: 2, y: 1, width: 4, height: 4, rotation: 0 })
  ]
  return [
    { id: 'shapes-and-background', rgba: await pixelsFromPng(await renderDocumentPNG(doc('shapes', 'white'), shapeLayers)) },
    { id: 'pixel-stack-blend-if', rgba: await pixelsFromPng(await renderDocumentPNG(doc('pixels', 'transparent'), pixelLayers)) },
    { id: 'combined-styles-over-backdrop', rgba: await pixelsFromPng(await renderDocumentPNG(doc('combined', 'transparent'), combinedLayers)) }
  ]
}

async function assertUnsupportedShapeStyleRejects() {
  const stroke = createDefaultLayerEffect('stroke', 'unsupported-shape-stroke')
  const styles = createLayerStyleConfig()
  styles.effects = [stroke]
  const shape = rectangle('unsupported-shape', '#ffffff',
    { x: 2, y: 1, width: 3, height: 3, rotation: 0 }, { styles })
  try {
    await renderDocumentPNG(doc('unsupported', 'transparent'), [shape])
  } catch (error) {
    if (error instanceof LayerStyleUnsupportedEffectError && error.effectTypes.includes('stroke')) return
    throw new Error(`A rejeição não identificou o efeito: ${error}`)
  }
  throw new Error('O compositor aceitou em silêncio um estilo não suportado em forma.')
}

async function compareRustUnderlying() {
  const runtime = await createRustPixelPocRuntime(await (await fetch(wasmUrl)).arrayBuffer())
  let cases = 0, maxAlphaDifference = 0, maxPremultipliedDifference = 0
  try {
    for (const channel of ['gray', 'red', 'green', 'blue']) {
      for (const mode of ['normal', 'multiply', 'screen', 'overlay', 'darken', 'lighten']) {
        const lower = imageLayer(`oracle-base-${cases}`, [
          0, 30, 200, 255, 64, 125, 200, 109, 192, 50, 30, 255, 255, 200, 20, 128
        ])
        const styles = createLayerStyleConfig()
        const range = channel === 'blue'
          ? { shadows: [60, 60], highlights: [210, 210] }
          : { shadows: [0, 128], highlights: [200, 255] }
        styles.blendIf.channel = channel; styles.blendIf.underlyingLayer = range
        const upper = imageLayer(`oracle-upper-${cases}`, [
          240, 50, 130, 101, 20, 210, 70, 203, 120, 100, 230, 255, 240, 50, 130, 3
        ], { opacity: 63.7, blendMode: mode, styles })
        const raster = async (item) => {
          const image = new Image(); image.src = item.image.sourceUrl; await image.decode()
          const canvas = document.createElement('canvas'); canvas.width = 2; canvas.height = 2
          const context = canvas.getContext('2d', { willReadFrequently: true }); context.drawImage(image, 0, 0)
          return { rgba: new Uint8Array(context.getImageData(0, 0, 2, 2).data), width: 2, height: 2,
            x: 0, y: 0, visible: true, opacity: item.opacity, blendMode: item.blendMode,
            sourceToDocument: [1, 0, 0, 1, 3, 2] }
        }
        const bottom = await raster(lower), top = { ...await raster(upper), underlyingBlendIf: { channel, ...range } }
        const actual = runtime.composeDocumentRegion({ documentWidth: width, documentHeight: height,
          region: { x: 0, y: 0, width, height }, resolutionScale: 1,
          outputGrid: { scaleX: 1, scaleY: 1, originX: 0, originY: 0 }, layersBottomToTop: [bottom, top] }).rgba
        const expected = await pixelsFromPng(await renderDocumentPNG(doc(`underlying-${cases}`, 'transparent'), [upper, lower]))
        for (let index = 0; index < actual.length; index += 4) {
          maxAlphaDifference = Math.max(maxAlphaDifference, Math.abs(actual[index + 3] - expected[index + 3]))
          for (let color = 0; color < 3; color++) maxPremultipliedDifference = Math.max(maxPremultipliedDifference,
            Math.abs(actual[index + color] * actual[index + 3] / 255 - expected[index + color] * expected[index + 3] / 255))
        }
        cases++
      }
    }
    if (maxAlphaDifference > 2 || maxPremultipliedDifference > 3) {
      throw new Error(`DCP3/Canvas: alpha=${maxAlphaDifference}, premultiplied=${maxPremultipliedDifference}`)
    }
    return { cases, maxAlphaDifference, maxPremultipliedDifference, alphaTolerance: 2, premultipliedTolerance: 3 }
  } finally { runtime.dispose() }
}

async function compareEditorialConsumer() {
  const { rustDocumentRendererStats } = await import('../src/services/rustDocumentRenderer.ts')
  const initialSession = rustDocumentRendererStats()
  const original = location.href
  const back = imageLayer('editorial-back', [100, 150, 200, 255, 64, 90, 150, 128, 192, 80, 40, 255, 255, 200, 100, 128])
  const styles = createLayerStyleConfig(); styles.fillOpacity = 65
  const overlay = createDefaultLayerEffect('color-overlay', 'editorial-overlay'); overlay.color = '#00ff00'; overlay.opacity = 37
  const shadow = createDefaultLayerEffect('drop-shadow', 'editorial-shadow')
  Object.assign(shadow, { color: '#0000ff', distance: 1, size: 0, angle: 0, useGlobalLight: false, blendMode: 'normal' })
  styles.effects = [shadow, overlay]
  styles.blendIf.channel = 'red'; styles.blendIf.underlyingLayer.shadows = [0, 128]
  const top = imageLayer('editorial-top', [240, 50, 130, 101, 20, 210, 70, 203, 120, 100, 230, 255, 240, 50, 130, 3],
    { styles, opacity: 63.7, blendMode: 'multiply' })
  const fixtures = [
    { document: doc('editorial-transparent', 'transparent'), layers: [top, back] },
    { document: doc('editorial-background', 'white'), layers: [top, back, layer('background', 'background', {}, undefined)] }
  ]
  const references = []
  for (const fixture of fixtures) references.push({ pixels: await pixelsFromPng(await renderDocumentPNG(fixture.document, fixture.layers)),
    color: await sampleDocumentColor(fixture.document, fixture.layers, 3, 2) })
  const enabled = new URL(location.href); enabled.searchParams.set('axiaRustDocument', '1'); enabled.searchParams.set('axiaRustStyles', '1')
  let maxAlphaDifference = 0, maxPremultipliedDifference = 0
  const backend = () => JSON.parse(document.documentElement.dataset.axiaRustDocument || '{}')
  const compare = (actual, expected) => {
    for (let i = 0; i < actual.length; i += 4) {
      maxAlphaDifference = Math.max(maxAlphaDifference, Math.abs(actual[i + 3] - expected[i + 3]))
      for (let c = 0; c < 3; c++) maxPremultipliedDifference = Math.max(maxPremultipliedDifference,
        Math.abs(actual[i + c] * actual[i + 3] / 255 - expected[i + c] * expected[i + 3] / 255))
    }
  }
  history.replaceState(null, '', enabled)
  try {
    for (let index = 0; index < fixtures.length; index++) {
      const fixture = fixtures[index], reference = references[index]
      const png = await renderDocumentPNG(fixture.document, fixture.layers)
      if (backend().backend !== 'rust') throw new Error(`PNG editorial em fallback: ${JSON.stringify(backend())}`)
      compare(await pixelsFromPng(png), reference.pixels)
      const blob = await renderDocumentBlob(fixture.document, fixture.layers)
      if (backend().backend !== 'rust') throw new Error('Blob editorial em fallback')
      const url = URL.createObjectURL(blob)
      try { compare(await pixelsFromPng(url), reference.pixels) } finally { URL.revokeObjectURL(url) }
      const sampled = await sampleDocumentColor(fixture.document, fixture.layers, 3, 2)
      if (backend().backend !== 'rust') throw new Error('Conta-gotas editorial em fallback')
      for (let c = 0; c < 3; c++) if (Math.abs(parseInt(sampled.slice(1 + c * 2, 3 + c * 2), 16) -
        parseInt(reference.color.slice(1 + c * 2, 3 + c * 2), 16)) > 2) throw new Error('Conta-gotas divergiu do Canvas')
      const session = rustDocumentRendererStats()
      if (session.preparations - initialSession.preparations !== index + 1 ||
          session.reuses - initialSession.reuses !== (index + 1) * 2 || !session.workerAlive || session.preparedBytes <= 0) {
        throw new Error(`Sessão não reutilizou preparação entre PNG/Blob/cor: ${JSON.stringify(session)}`)
      }
    }
    await renderDocumentPNG(doc('fallback', 'transparent'), [layer('unsupported', 'text', { text: { ...DEFAULT_TEXT_LAYER, content: 'Axia' } }, { x: 1, y: 1, width: 3, height: 3, rotation: 30 }, { styles: { ...createLayerStyleConfig(), effects: [createDefaultLayerEffect('drop-shadow')] } })])
    if (backend().backend !== 'legacy' || backend().reason !== 'source-transform-quality') throw new Error('Fallback editorial ausente')
    if (maxAlphaDifference > 2 || maxPremultipliedDifference > 3) throw new Error(`Paridade editorial: ${maxAlphaDifference}/${maxPremultipliedDifference}`)
    return { documents: fixtures.length, consumers: ['PNG', 'Blob', 'sample'], fallback: true,
      maxAlphaDifference, maxPremultipliedDifference, session: rustDocumentRendererStats() }
  } finally { history.replaceState(null, '', original) }
}

async function compareShapeConsumer() {
  const { rustDocumentRendererStats, disposeRustDocumentRenderer } = await import('../src/services/rustDocumentRenderer.ts')
  const initialSession = rustDocumentRendererStats()
  const original = location.href, enabled = new URL(original); enabled.searchParams.set('axiaRustDocument', '1')
  let cases = 0, maxAlphaDifference = 0, maxPremultipliedDifference = 0
  try {
    for (const kind of ['rectangle', 'ellipse', 'triangle', 'star']) {
      for (const [index, blendMode] of ['normal', 'multiply', 'screen', 'overlay', 'darken', 'lighten'].entries()) {
        const fractional = index >= 2, rotation = [0, 0, 37, -90, 128, 180][index]
        const top = rectangle(`shape-${cases}`, '#e04090', {
          x: fractional ? 1.125 : 1, y: fractional ? 0.75 : 1,
          width: fractional ? 4.25 : 5, height: fractional ? 3.25 : 4, rotation
        }, { opacity: index % 2 ? 63.7 : 100, blendMode })
        Object.assign(top.shape, { kind, baseWidth: 100, baseHeight: 80, cornerRadius: 3,
          squareness: index % 2 ? 55 : 0, starPoints: 7, starInnerRatio: 37 })
        top.styles.fillOpacity = index % 2 ? 37 : 100
        const bottom = index % 2 ? imageLayer('shape-image-back', [
          20, 96, 255, 109, 20, 96, 255, 109, 20, 96, 255, 109, 20, 96, 255, 109
        ]) : rectangle('shape-back', '#2060ff', { x: 0, y: 0, width, height, rotation: 0 }, { opacity: 43.7 })
        const documentSpec = doc(`shape-document-${cases}`, index % 2 ? 'white' : 'transparent')
        const layers = [top, bottom, layer('background', 'background', {}, undefined)]
        const expected = await pixelsFromPng(await renderDocumentPNG(documentSpec, layers))
        history.replaceState(null, '', enabled)
        const actual = await pixelsFromPng(await renderDocumentPNG(documentSpec, layers))
        const backend = JSON.parse(document.documentElement.dataset.axiaRustDocument || '{}')
        if (backend.backend !== 'rust') throw new Error(`Forma ${kind}/${blendMode} em fallback: ${JSON.stringify(backend)}`)
        history.replaceState(null, '', original)
        for (let i = 0; i < actual.length; i += 4) {
          maxAlphaDifference = Math.max(maxAlphaDifference, Math.abs(actual[i + 3] - expected[i + 3]))
          for (let c = 0; c < 3; c++) maxPremultipliedDifference = Math.max(maxPremultipliedDifference,
            Math.abs(actual[i + c] * actual[i + 3] / 255 - expected[i + c] * expected[i + 3] / 255))
        }
        cases++
      }
    }
    if (maxAlphaDifference > 2 || maxPremultipliedDifference > 3) throw new Error(`Paridade de formas: ${maxAlphaDifference}/${maxPremultipliedDifference}`)
    const session = rustDocumentRendererStats()
    if (session.connections !== initialSession.connections || session.preparations - initialSession.preparations !== cases) {
      throw new Error(`Formas recriaram Worker ou reutilizaram fonte incorreta: ${JSON.stringify(session)}`)
    }
    return { cases, maxAlphaDifference, maxPremultipliedDifference, alphaTolerance: 2, premultipliedTolerance: 3, session }
  } finally { await disposeRustDocumentRenderer(); history.replaceState(null, '', original) }
}

async function compareTextConsumer() {
  const { rustDocumentRendererStats, disposeRustDocumentRenderer } = await import('../src/services/rustDocumentRenderer.ts')
  const original = location.href, enabled = new URL(original); enabled.searchParams.set('axiaRustDocument', '1')
  const textWidth = 96, textHeight = 48
  const spec = (id, background) => ({ ...doc(id, background), width: textWidth, height: textHeight,
    physicalWidth: textWidth, physicalHeight: textHeight })
  const fonts = ['Arial, sans-serif', 'Georgia, serif', 'Consolas, monospace']
  const variants = [
    { text: { content: 'Axia 12', fontSize: 18, color: '#e04090' }, base: [80, 24], center: [44, 16], scale: 1, rotation: 0, opacity: 100, back: false, background: 'transparent' },
    { text: { content: 'Ab\nCd fg', fontSize: 14, alignment: 'center', fontStyle: 'italic', color: '#1a1a1a' }, base: [60, 36], center: [40.25, 22.5], scale: 1, rotation: 0, opacity: 63.7, back: false, background: 'white' },
    { text: { content: 'Lorem ipsum dolor sit amet', fontSize: 12, layoutMode: 'paragraph', alignment: 'right', color: '#2050ff' }, base: [70, 40], center: [48.5, 24.75], scale: 1, rotation: 37, opacity: 100, back: true, background: 'transparent' },
    { text: { content: 'texto sublinhado', fontSize: 13, fontWeight: 700, decoration: 'underline', textTransform: 'uppercase', letterSpacing: 1.5, color: '#e04090' }, base: [130, 18], center: [47.5, 23.25], scale: 1, rotation: -90, opacity: 100, back: false, background: 'white' },
    { text: { content: 'riscado', fontSize: 16, decoration: 'line-through', letterSpacing: -0.5, color: '#1a1a1a' }, base: [70, 22], center: [48, 24], scale: 1.6, rotation: 180, opacity: 100, back: true, background: 'transparent' },
    { text: { content: 'ao redor da elipse', fontSize: 9, pathMode: 'ellipse', color: '#2050ff' }, base: [80, 40], center: [48, 24], scale: 1, rotation: 12, opacity: 80, back: true, background: 'white' }
  ]
  let cases = 0, maxAlphaDifference = 0, maxPremultipliedDifference = 0, worst = '', minInkedPixels = Infinity
  try {
    for (const fontFamily of fonts) {
      await document.fonts.load(`16px ${fontFamily}`)
      for (const [index, variant] of variants.entries()) {
        const [baseWidth, baseHeight] = variant.base, w = baseWidth * variant.scale, h = baseHeight * variant.scale
        const text = layer(`text-${cases}`, 'text', { text: { ...DEFAULT_TEXT_LAYER, fontFamily, baseWidth, baseHeight, ...variant.text } },
          { x: variant.center[0] - w / 2, y: variant.center[1] - h / 2, width: w, height: h, rotation: variant.rotation },
          { opacity: variant.opacity })
        const layers = [text, ...(variant.back ? [rectangle(`text-back-${cases}`, '#30c060',
          { x: 0, y: 0, width: textWidth, height: textHeight, rotation: 0 }, { opacity: 43.7 })] : []),
          layer('background', 'background', {}, undefined)]
        const documentSpec = spec(`text-document-${cases}`, variant.background)
        history.replaceState(null, '', original)
        const withoutText = await pixelsFromPng(await renderDocumentPNG(documentSpec, layers.slice(1)), textWidth, textHeight)
        const expected = await pixelsFromPng(await renderDocumentPNG(documentSpec, layers), textWidth, textHeight)
        history.replaceState(null, '', enabled)
        const actual = await pixelsFromPng(await renderDocumentPNG(documentSpec, layers), textWidth, textHeight)
        const backend = JSON.parse(document.documentElement.dataset.axiaRustDocument || '{}')
        if (backend.backend !== 'rust') throw new Error(`Texto ${fontFamily}/${index} em fallback: ${JSON.stringify(backend)}`)
        let alpha = 0, color = 0, inked = 0
        for (let i = 0; i < actual.length; i += 4) {
          if ([0, 1, 2, 3].some(c => Math.abs(expected[i + c] - withoutText[i + c]) > 8)) inked++
          alpha = Math.max(alpha, Math.abs(actual[i + 3] - expected[i + 3]))
          for (let c = 0; c < 3; c++) color = Math.max(color,
            Math.abs(actual[i + c] * actual[i + 3] / 255 - expected[i + c] * expected[i + 3] / 255))
        }
        // O texto precisa alterar a imagem: dois renders vazios ou só de fundo coincidiriam sem provar nada.
        if (inked < 20) throw new Error(`Texto ${fontFamily}/${index} sem tinta: ${inked}`)
        minInkedPixels = Math.min(minInkedPixels, inked)
        if (alpha + color > maxAlphaDifference + maxPremultipliedDifference) worst = `${fontFamily}/${index}`
        maxAlphaDifference = Math.max(maxAlphaDifference, alpha); maxPremultipliedDifference = Math.max(maxPremultipliedDifference, color)
        cases++
      }
    }
    // Modos de mesclagem: semântica do preview (contrato de texto, seção 4). O texto isolado é a mesma
    // rasterização já conferida acima em Normal; aqui o Canvas o mescla uma vez sobre o resto do documento.
    const { planRustDocumentText, drawRustDocumentText } = await import('../src/editor/rustDocumentText.ts')
    // O Chromium ignora replaceState acima de ~200 chamadas em 10 s: as referências legadas (o documento
    // sem o texto depende só do fundo) são feitas antes, e a URL muda uma vez só.
    const rest = [rectangle('text-blend-back', '#30c060', { x: 0, y: 0, width: textWidth, height: textHeight, rotation: 0 },
      { opacity: 63.7 }), layer('background', 'background', {}, undefined)]
    history.replaceState(null, '', original)
    const withoutTextBy = {}
    for (const background of ['white', 'transparent']) {
      withoutTextBy[background] = await pixelsFromPng(await renderDocumentPNG(spec(`text-blend-${background}`, background), rest), textWidth, textHeight)
    }
    history.replaceState(null, '', enabled)
    let blendCases = 0
    for (const fontFamily of fonts) for (const index of [1, 2, 3]) {
      const variant = variants[index]
      for (const blendMode of ['multiply', 'screen', 'overlay', 'darken', 'lighten']) {
        const [baseWidth, baseHeight] = variant.base, w = baseWidth * variant.scale, h = baseHeight * variant.scale
        const transform = { x: variant.center[0] - w / 2, y: variant.center[1] - h / 2, width: w, height: h, rotation: variant.rotation }
        // Rosa sobre o verde do fundo: todos os modos alteram a imagem (texto escuro em Clarear não alteraria).
        const content = { ...DEFAULT_TEXT_LAYER, fontFamily, baseWidth, baseHeight, ...variant.text, color: '#e04090' }
        const text = layer(`text-blend-${blendCases}`, 'text', { text: content }, transform, { opacity: variant.opacity, blendMode })
        const documentSpec = spec(`text-blend-document-${blendCases}`, variant.background)
        const withoutText = withoutTextBy[variant.background]
        const isolated = drawRustDocumentText(planRustDocumentText(content, transform, textWidth, textHeight, variant.opacity / 100))
        const reference = new OffscreenCanvas(textWidth, textHeight), context = reference.getContext('2d')
        context.putImageData(new ImageData(new Uint8ClampedArray(withoutText), textWidth, textHeight), 0, 0)
        const ink = new OffscreenCanvas(isolated.width, isolated.height)
        ink.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(isolated.rgba), isolated.width, isolated.height), 0, 0)
        context.globalCompositeOperation = blendMode
        context.drawImage(ink, isolated.originX, isolated.originY)
        const expected = context.getImageData(0, 0, textWidth, textHeight).data
        const actual = await pixelsFromPng(await renderDocumentPNG(documentSpec, [text, ...rest]), textWidth, textHeight)
        const backend = JSON.parse(document.documentElement.dataset.axiaRustDocument || '{}')
        if (backend.backend !== 'rust') throw new Error(`Texto ${blendMode} ${fontFamily}/${index} em fallback: ${JSON.stringify(backend)}`)
        let alpha = 0, color = 0, inked = 0
        for (let i = 0; i < actual.length; i += 4) {
          if ([0, 1, 2, 3].some(c => Math.abs(actual[i + c] - withoutText[i + c]) > 8)) inked++
          alpha = Math.max(alpha, Math.abs(actual[i + 3] - expected[i + 3]))
          for (let c = 0; c < 3; c++) color = Math.max(color,
            Math.abs(actual[i + c] * actual[i + 3] / 255 - expected[i + c] * expected[i + 3] / 255))
        }
        if (inked < 20) throw new Error(`Texto ${blendMode} ${fontFamily}/${index} sem efeito: ${inked}`)
        if (alpha + color > maxAlphaDifference + maxPremultipliedDifference) worst = `${blendMode} ${fontFamily}/${index}`
        maxAlphaDifference = Math.max(maxAlphaDifference, alpha); maxPremultipliedDifference = Math.max(maxPremultipliedDifference, color)
        blendCases++
      }
    }
    // Texto com estilo: raster da camada com estilos e matriz, a mesma semântica do legado, que é a referência.
    const styledCases = []
    for (const fontFamily of fonts) for (const [index, styled] of [
      { effects: ['drop-shadow'], rotation: 0, blendMode: 'normal', background: 'white' },
      { effects: ['stroke'], rotation: 90, blendMode: 'multiply', background: 'transparent' },
      { effects: ['color-overlay', 'outer-glow'], rotation: 180, blendMode: 'normal', background: 'transparent' },
      { fillOpacity: 40, effects: ['drop-shadow'], rotation: 0, blendMode: 'screen', background: 'white' }
    ].entries()) {
      const styles = { ...createLayerStyleConfig(), fillOpacity: styled.fillOpacity ?? 100,
        effects: styled.effects.map(type => createDefaultLayerEffect(type)) }
      const content = { ...DEFAULT_TEXT_LAYER, fontFamily, content: 'Axia 7', fontSize: 16, color: '#e04090', baseWidth: 60, baseHeight: 22 }
      const text = layer(`text-styled-${styledCases.length}`, 'text', { text: content },
        { x: 18, y: 13, width: 60, height: 22, rotation: styled.rotation }, { opacity: 80, blendMode: styled.blendMode, styles })
      const rest = [rectangle('text-styled-back', '#30c060', { x: 0, y: 0, width: textWidth, height: textHeight, rotation: 0 },
        { opacity: 43.7 }), layer('background', 'background', {}, undefined)]
      styledCases.push({ id: `${fontFamily}/${index}`, spec: spec(`text-styled-document-${styledCases.length}`, styled.background),
        layers: [text, ...rest], rest })
    }
    history.replaceState(null, '', original)
    for (const item of styledCases) {
      item.expected = await pixelsFromPng(await renderDocumentPNG(item.spec, item.layers), textWidth, textHeight)
      item.withoutText = await pixelsFromPng(await renderDocumentPNG(item.spec, item.rest), textWidth, textHeight)
    }
    history.replaceState(null, '', enabled)
    for (const item of styledCases) {
      const actual = await pixelsFromPng(await renderDocumentPNG(item.spec, item.layers), textWidth, textHeight)
      const backend = JSON.parse(document.documentElement.dataset.axiaRustDocument || '{}')
      if (backend.backend !== 'rust') throw new Error(`Texto com estilo ${item.id} em fallback: ${JSON.stringify(backend)}`)
      let alpha = 0, color = 0, inked = 0
      for (let i = 0; i < actual.length; i += 4) {
        if ([0, 1, 2, 3].some(c => Math.abs(item.expected[i + c] - item.withoutText[i + c]) > 8)) inked++
        alpha = Math.max(alpha, Math.abs(actual[i + 3] - item.expected[i + 3]))
        for (let c = 0; c < 3; c++) color = Math.max(color,
          Math.abs(actual[i + c] * actual[i + 3] / 255 - item.expected[i + c] * item.expected[i + 3] / 255))
      }
      if (inked < 20) throw new Error(`Texto com estilo ${item.id} sem tinta: ${inked}`)
      if (alpha + color > maxAlphaDifference + maxPremultipliedDifference) worst = `estilo ${item.id}`
      maxAlphaDifference = Math.max(maxAlphaDifference, alpha); maxPremultipliedDifference = Math.max(maxPremultipliedDifference, color)
    }
    if (maxAlphaDifference > 2 || maxPremultipliedDifference > 3) {
      throw new Error(`Paridade de texto: ${maxAlphaDifference}/${maxPremultipliedDifference} (pior: ${worst})`)
    }
    // Conta-gotas reaproveita a preparação da sessão; o texto não deve ser rasterizado a cada amostra.
    const sampleSpec = spec('text-sample', 'white')
    const sampleText = layer('text-sample-layer', 'text', { text: { ...DEFAULT_TEXT_LAYER, fontFamily: fonts[0], content: 'I',
      fontSize: 40, color: '#e04090', baseWidth: 30, baseHeight: 46 } }, { x: 30, y: 0, width: 30, height: 46, rotation: 0 })
    const before = rustDocumentRendererStats()
    for (let i = 0; i < 3; i++) await sampleDocumentColor(sampleSpec, [sampleText, layer('background', 'background', {}, undefined)], 40, 24)
    const after = rustDocumentRendererStats()
    if (JSON.parse(document.documentElement.dataset.axiaRustDocument || '{}').backend !== 'rust' ||
        after.preparations - before.preparations !== 1 || after.reuses - before.reuses !== 2) {
      throw new Error(`Conta-gotas de texto não reutilizou a sessão: ${JSON.stringify({ before, after })}`)
    }
    return { cases, blendCases, styledCases: styledCases.length, fonts: fonts.length, minInkedPixels, maxAlphaDifference, maxPremultipliedDifference, worst,
      alphaTolerance: 2, premultipliedTolerance: 3, sampleReuses: after.reuses - before.reuses }
  } finally { await disposeRustDocumentRenderer(); history.replaceState(null, '', original) }
}

async function verifyDocumentSessionEpoch() {
  const { renderRustDocumentCanvas, disposeRustDocumentRenderer, rustDocumentRendererStats } = await import('../src/services/rustDocumentRenderer.ts')
  const documentSpec = doc('session-epoch', 'transparent')
  const layers = [rectangle('session-epoch-shape', '#ff0000', { x: 0, y: 0, width: 2, height: 2, rotation: 0 })]
  const obsolete = renderRustDocumentCanvas(documentSpec, layers, width, height, { x: 0, y: 0, width, height })
    .then(() => { throw new Error('Chamada obsoleta reabriu sessão após dispose') }, error => {
      if (error.message !== 'wasm-unavailable') throw error
    })
  await Promise.all([obsolete, disposeRustDocumentRenderer()])
  if (rustDocumentRendererStats().workerAlive) throw new Error('Sessão obsoleta conservou Worker')
  const canvas = await renderRustDocumentCanvas(documentSpec, layers, width, height, { x: 0, y: 0, width, height })
  try {
    if (canvas.getContext('2d').getImageData(0, 0, 1, 1).data.join(',') !== '255,0,0,255' ||
        rustDocumentRendererStats().connections !== 1) throw new Error('Sessão não reabriu limpa após descarte')
  } finally { canvas.width = 1; canvas.height = 1; await disposeRustDocumentRenderer() }
  return { obsoleteRejected: true, reopened: true, disposed: !rustDocumentRendererStats().workerAlive }
}

async function compareAppearanceConsumers() {
  const { disposeRustDocumentRenderer } = await import('../src/services/rustDocumentRenderer.ts')
  const original = location.href, enabled = new URL(original); enabled.searchParams.set('axiaRustDocument', '1')
  const spec = doc('appearance-consumers', 'transparent'), fixtures = []
  function addAppearance(item, documentSpec = spec, fallbackReason) {
    for (const mode of ['local', 'isolated-export']) fixtures.push({
      id: `${item.id}-${mode}`, purpose: 'layer', fallbackReason, render: () => renderLayerAppearance(documentSpec, item, mode)
    })
  }
  const styled = createLayerStyleConfig(); styled.fillOpacity = 0
  const shadow = createDefaultLayerEffect('drop-shadow', 'appearance-shadow')
  Object.assign(shadow, { color: '#ff0000', size: 0, distance: 1, angle: 0, useGlobalLight: false, blendMode: 'normal' })
  const overlay = createDefaultLayerEffect('color-overlay', 'appearance-overlay')
  Object.assign(overlay, { color: '#0000ff', opacity: 37, blendMode: 'normal' }); styled.effects = [shadow, overlay]
  for (const [index, position] of [[-2, -1], [8.5, 6.25], [0, 0]].entries()) {
    const item = imageLayer(`appearance-image-${index}`, [
      20, 80, 160, 255, 90, 150, 210, 109, 192, 80, 40, 255, 255, 200, 100, 128
    ], { opacity: 63.7, blendMode: 'screen', styles: structuredClone(styled) })
    Object.assign(item.transform, { x: position[0], y: position[1], rotation: index === 1 ? 90 : 0 })
    addAppearance(item, spec)
  }
  const rotated = imageLayer('appearance-pixel-aligned-rotation', new Array(4).fill([255, 0, 0, 255]).flat(),
    { opacity: 63.7, styles: structuredClone(styled) })
  Object.assign(rotated.transform, { x: 9, y: 7, rotation: 90 }); addAppearance(rotated)
  for (const kind of ['rectangle', 'ellipse', 'triangle', 'star']) {
    const item = rectangle(`appearance-${kind}`, '#e04090',
      { x: -3.5, y: -1.25, width: 4.25, height: 2.75, rotation: kind === 'star' ? 37 : 0 },
      { visible: false, opacity: 63.7, blendMode: 'multiply' })
    item.shape.kind = kind; item.styles.fillOpacity = 37; addAppearance(item)
    const mergedShape = structuredClone(item); mergedShape.visible = true
    const lower = rectangle('merge-shape-lower', '#2060ff', { x: 0, y: 0, width, height, rotation: 0 }, { opacity: 43.7 })
    fixtures.push({ id: `merge-${kind}`, purpose: 'merge', render: () => renderMergedLayers(spec, [mergedShape, lower]) })
  }
  const background = layer('appearance-background', 'background', {}, undefined, { opacity: 50 })
  background.styles.fillOpacity = 50; addAppearance(background, doc('appearance-background-document', 'white'))
  for (const [index, blendMode] of ['normal', 'multiply', 'screen', 'overlay', 'darken', 'lighten'].entries()) {
    const style = createLayerStyleConfig(); style.fillOpacity = 65
    style.blendIf.channel = ['gray', 'red', 'green', 'blue'][index % 4]
    style.blendIf.underlyingLayer.shadows = [0, 128]
    const upper = imageLayer(`merge-top-${index}`, [240, 50, 130, 101, 20, 210, 70, 203, 120, 100, 230, 255, 240, 50, 130, 3],
      { opacity: 63.7, blendMode, styles: style })
    const lower = imageLayer(`merge-back-${index}`, [100, 150, 200, 255, 64, 90, 150, 128, 192, 80, 40, 255, 255, 200, 100, 128])
    const documentSpec = doc(`merge-document-${index}`, index % 2 ? 'white' : 'transparent')
    fixtures.push({ id: `merge-${blendMode}`, purpose: 'merge',
      render: () => renderMergedLayers(documentSpec, [upper, lower, layer('background', 'background', {}, undefined)]) })
  }
  async function pixels(blob) {
    const bitmap = await createImageBitmap(blob), canvas = document.createElement('canvas')
    try {
      canvas.width = bitmap.width; canvas.height = bitmap.height
      const context = canvas.getContext('2d', { willReadFrequently: true }); context.drawImage(bitmap, 0, 0)
      return context.getImageData(0, 0, canvas.width, canvas.height).data
    } finally { bitmap.close(); canvas.width = 1; canvas.height = 1 }
  }
  let maxAlphaDifference = 0, maxPremultipliedDifference = 0
  try {
    for (const fixture of fixtures) {
      const expected = await fixture.render(), expectedPixels = await pixels(expected.blob)
      history.replaceState(null, '', enabled)
      const actual = await fixture.render(), backend = JSON.parse(document.documentElement.dataset.axiaRustDocument || '{}')
      if (backend.backend !== (fixture.fallbackReason ? 'legacy' : 'rust') || backend.purpose !== fixture.purpose ||
          fixture.fallbackReason && backend.reason !== fixture.fallbackReason) throw new Error(`${fixture.id}: backend inesperado ${JSON.stringify(backend)} em ${location.search}`)
      history.replaceState(null, '', original)
      for (const key of ['x', 'y', 'width', 'height']) if (actual[key] !== expected[key]) throw new Error(`${fixture.id}: bounds ${key} divergentes`)
      const actualPixels = await pixels(actual.blob)
      if (actualPixels.length !== expectedPixels.length) throw new Error(`${fixture.id}: PNG tem dimensões divergentes`)
      let alphaDifference = 0, colorDifference = 0
      for (let i = 0; i < actualPixels.length; i += 4) {
        alphaDifference = Math.max(alphaDifference, Math.abs(actualPixels[i + 3] - expectedPixels[i + 3]))
        maxAlphaDifference = Math.max(maxAlphaDifference, Math.abs(actualPixels[i + 3] - expectedPixels[i + 3]))
        for (let c = 0; c < 3; c++) {
          const difference = Math.abs(actualPixels[i + c] * actualPixels[i + 3] / 255 - expectedPixels[i + c] * expectedPixels[i + 3] / 255)
          colorDifference = Math.max(colorDifference, difference); maxPremultipliedDifference = Math.max(maxPremultipliedDifference, difference)
        }
      }
      if (alphaDifference > 2 || colorDifference > 3) throw new Error(`${fixture.id}: paridade ${alphaDifference}/${colorDifference}`)
    }
    if (maxAlphaDifference > 2 || maxPremultipliedDifference > 3) throw new Error(`Paridade aparência/mesclagem: ${maxAlphaDifference}/${maxPremultipliedDifference}`)
    history.replaceState(null, '', enabled)
    // Redução deixou de ser fallback: 0,5 usa o bilinear e 0,25 a média de área.
    for (const size of [1, 0.5]) {
      const reduced = imageLayer(`appearance-reduced-${size}`, new Array(4).fill([255, 0, 0, 255]).flat())
      Object.assign(reduced.transform, { width: size, height: size })
      await renderLayerAppearance(spec, reduced)
      const reducedBackend = JSON.parse(document.documentElement.dataset.axiaRustDocument || '{}')
      if (reducedBackend.backend !== 'rust' || reducedBackend.purpose !== 'layer') throw new Error(`Redução ${size} da aparência fora do Rust: ${JSON.stringify(reducedBackend)}`)
    }
    // Rotação arbitrária continua sem modo raster e mantém o fallback da aparência.
    const rotated = imageLayer('appearance-rotated', new Array(4).fill([255, 0, 0, 255]).flat())
    Object.assign(rotated.transform, { rotation: 30 })
    await renderLayerAppearance(spec, rotated)
    const fallback = JSON.parse(document.documentElement.dataset.axiaRustDocument || '{}')
    if (fallback.backend !== 'legacy' || fallback.purpose !== 'layer' || fallback.reason !== 'source-transform-quality') throw new Error('Fallback de transformação da aparência ausente')
    const text = layer('merge-text-fallback', 'text', { text: { ...DEFAULT_TEXT_LAYER, content: 'Axia' } }, { x: 1, y: 1, width: 3, height: 3, rotation: 30 }, { styles: { ...createLayerStyleConfig(), effects: [createDefaultLayerEffect('drop-shadow')] } })
    await renderMergedLayers(spec, [text])
    const textFallback = JSON.parse(document.documentElement.dataset.axiaRustDocument || '{}')
    if (textFallback.backend !== 'legacy' || textFallback.purpose !== 'merge' || textFallback.reason !== 'source-transform-quality') throw new Error('Fallback textual de mesclagem ausente')
    const encode = HTMLCanvasElement.prototype.toBlob
    for (const rust of [false, true]) for (const purpose of ['layer', 'merge']) {
      history.replaceState(null, '', rust ? enabled : original)
      let captured, rejected = false
      HTMLCanvasElement.prototype.toBlob = function(callback) { captured = this; callback(null) }
      try {
        const shape = rectangle('failed-encoding', '#ff0000', { x: 0, y: 0, width: 2, height: 2, rotation: 0 })
        await (purpose === 'layer' ? renderLayerAppearance(spec, shape) : renderMergedLayers(spec, [shape]))
      } catch (error) { rejected = error.message.includes(purpose === 'layer' ? 'aparência' : 'mesclagem') }
      finally { HTMLCanvasElement.prototype.toBlob = encode }
      if (!rejected || !captured || captured.width !== 1 || captured.height !== 1) throw new Error(`${purpose}: falha de encode reteve canvas de saída`)
    }
    return { cases: fixtures.length, rustCases: fixtures.filter(item => !item.fallbackReason).length,
      transformFallbackCases: fixtures.filter(item => item.fallbackReason).length, appearanceCases: fixtures.filter(item => item.purpose === 'layer').length,
      mergeCases: fixtures.filter(item => item.purpose === 'merge').length, maxAlphaDifference, maxPremultipliedDifference,
      alphaTolerance: 2, premultipliedTolerance: 3, fallback: true, encodeFailureCleanup: true }
  } finally { await disposeRustDocumentRenderer(); history.replaceState(null, '', original) }
}

try {
  const cases = await renderCases()
  await assertUnsupportedShapeStyleRejects()
  const rustUnderlying = await compareRustUnderlying()
  const rustEditorial = await compareEditorialConsumer()
  const rustShapes = await compareShapeConsumer()
  const rustText = await compareTextConsumer()
  const rustSessionEpoch = await verifyDocumentSessionEpoch()
  const rustAppearance = await compareAppearanceConsumers()
  if (new URLSearchParams(location.search).has('record')) {
    result.textContent = JSON.stringify({ status: 'record', width, height, cases })
  } else {
    const response = await fetch('../tests/fixtures/documentOracle.v1.json')
    if (!response.ok || !response.headers.get('content-type')?.includes('json')) {
      result.textContent = JSON.stringify({ status: 'unbaselined', width, height, cases })
    } else {
      const golden = await response.json()
      const errors = []
      if (golden.schemaVersion !== 1 || golden.width !== width || golden.height !== height) {
        errors.push('schema/dimensões divergentes')
      }
      if (!Array.isArray(golden.cases) || golden.cases.length !== cases.length) {
        errors.push('quantidade de casos divergente')
      }
      for (const item of cases) {
        const references = Array.isArray(golden.cases)
          ? golden.cases.filter((entry) => entry?.id === item.id) : []
        const reference = references[0]
        const validRows = Array.isArray(reference?.rows) && reference.rows.length === height &&
          reference.rows.every((row) => typeof row === 'string' && row.split(' ').length === width)
        const cells = validRows ? reference.rows.flatMap((row) => row.split(' ')) : []
        if (references.length !== 1 || !validRows ||
          cells.length !== width * height || cells.some((cell) => !/^[0-9a-f]{8}$/.test(cell)) ||
          !Number.isInteger(reference.maxChannelDifference) ||
          reference.maxChannelDifference < 0 || reference.maxChannelDifference > 255) {
          errors.push(`${item.id}: fixture ausente ou inválida`)
          continue
        }
        let maxDifference = 0
        for (let index = 0; index < item.rgba.length; index++) {
          const expected = parseInt(cells[Math.floor(index / 4)].slice(index % 4 * 2, index % 4 * 2 + 2), 16)
          maxDifference = Math.max(maxDifference, Math.abs(item.rgba[index] - expected))
        }
        if (maxDifference > reference.maxChannelDifference) {
          errors.push(`${item.id}: diferença máxima ${maxDifference} > ${reference.maxChannelDifference}`)
        }
      }
      result.textContent = JSON.stringify({ status: errors.length ? 'fail' : 'pass', errors, cases: cases.length, rustUnderlying, rustEditorial, rustShapes, rustText, rustSessionEpoch, rustAppearance })
    }
  }
} catch (error) {
  result.textContent = JSON.stringify({ status: 'error', message: String(error), stack: error?.stack })
}
