<!doctype html>
<meta charset="utf-8">
<title>Axia layer image handoff benchmark</title>
<style>
  .document-layer { position: relative; width: 512px; height: 512px; }
  .layer-image-buffer { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
  .layer-image-buffer--active { opacity: 1; }
</style>
<div id="app"></div>
<pre id="result">running</pre>
<script type="module">
import { createApp, h, nextTick, ref } from 'vue'
import { useLayerImageBuffer } from '../src/components/canvas/composables/useLayerImageHandoff.ts'

const result = document.querySelector('#result')
const params = new URLSearchParams(location.search)

function boundedInteger(name, fallback, minimum, maximum) {
  const raw = params.get(name)
  const value = raw === null ? fallback : Number(raw)
  if (!Number.isInteger(value) || value < minimum || value > maximum) {
    throw new Error(`${name} deve ser inteiro entre ${minimum} e ${maximum}.`)
  }
  return value
}

function summary(samples) {
  const sorted = [...samples].sort((a, b) => a - b)
  const middle = Math.floor(sorted.length / 2)
  const median = sorted.length % 2 === 0
    ? (sorted[middle - 1] + sorted[middle]) / 2 : sorted[middle]
  return { samplesMs: samples.map((value) => +value.toFixed(2)),
    medianMs: +median.toFixed(2),
    p95ObservedMs: +sorted[Math.ceil(sorted.length * 0.95) - 1].toFixed(2) }
}

function sourceUrl(width, height, phase) {
  const canvas = document.createElement('canvas')
  canvas.width = width
  canvas.height = height
  const context = canvas.getContext('2d', { willReadFrequently: true })
  if (!context) throw new Error('Canvas 2D indisponível.')
  const pixels = context.createImageData(width, height)
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const index = (y * width + x) * 4
      pixels.data[index] = (x * 7 + y * 3 + phase * 17) & 255
      pixels.data[index + 1] = (x * 2 + y * 11 + phase * 31) & 255
      pixels.data[index + 2] = (x * 5 + y * 13 + phase * 47) & 255
      pixels.data[index + 3] = 255
    }
  }
  context.putImageData(pixels, 0, 0)
  return canvas.toDataURL('image/png')
}

let app
try {
  const width = boundedInteger('width', 512, 64, 1024)
  const height = boundedInteger('height', 512, 64, 1024)
  const samples = boundedInteger('samples', 5, 1, 10)
  if (width * height * (samples + 3) > 12_000_000) {
    throw new Error('Orçamento máximo de 12 milhões de pixels de origem por execução.')
  }
  const sourceStart = performance.now()
  const sources = Array.from({ length: samples + 3 }, (_, phase) => sourceUrl(width, height, phase))
  const sourceGenerationMs = +(performance.now() - sourceStart).toFixed(2)
  const desired = ref(sources[0])
  const layerRoot = ref(null)
  const pending = new Map()
  const transform = { x: 0, y: 0, width, height, rotation: 0 }

  function expectSource(source, started) {
    return new Promise((resolve, reject) => {
      const timeout = setTimeout(() => {
        pending.delete(source)
        reject(new Error('A troca de imagem não terminou em cinco segundos.'))
      }, 5000)
      pending.set(source, { started, resolve, reject, timeout })
    })
  }

  app = createApp({
    setup() {
      const buffer = useLayerImageBuffer({
        active: () => true,
        layer: () => ({ id: 'benchmark-layer', image: { sourceUrl: desired.value } }),
        transform: () => transform,
        layerRoot,
        imageSource: () => desired.value,
        imageLoaded: (_layerId, source) => {
          const entry = pending.get(source)
          if (!entry) return
          clearTimeout(entry.timeout)
          pending.delete(source)
          entry.resolve({ loadMs: entry.loadMs, decodeMs: entry.decodeMs,
            callbackMs: performance.now() - entry.started })
        },
        imageError: (_layerId, source) => {
          const entry = pending.get(source)
          if (!entry) return
          clearTimeout(entry.timeout)
          pending.delete(source)
          entry.reject(new Error('A imagem do buffer falhou ao carregar.'))
        }
      })
      return () => h('div', { ref: layerRoot, class: 'document-layer',
        style: { width: `${width}px`, height: `${height}px` } },
      buffer.imageSources.value.map((source, slot) => h('img', {
        key: slot,
        src: source ?? undefined,
        decoding: 'async',
        class: ['layer-image-buffer',
          buffer.activeImageSlot.value === slot && 'layer-image-buffer--active'],
        style: { display: source ? undefined : 'none' },
        onLoad: async (event) => {
          const entry = pending.get(source)
          if (entry) entry.loadMs = performance.now() - entry.started
          await buffer.handleImageLoad(slot, event)
          if (entry) entry.decodeMs = performance.now() - entry.started
        },
        onError: () => buffer.handleImageError(slot)
      })))
    }
  })

  const initialReady = expectSource(sources[0], performance.now())
  app.mount('#app')
  await initialReady

  function displayedSource() {
    return document.querySelector('.layer-image-buffer--active')?.getAttribute('src')
  }
  const observations = []
  for (let index = 1; index < sources.length; index++) {
    const previous = displayedSource()
    const source = sources[index]
    const started = performance.now()
    const ready = expectSource(source, started)
    desired.value = source
    await nextTick()
    if (displayedSource() !== previous) throw new Error('O buffer antigo sumiu antes do handoff.')
    const timings = await ready
    await nextTick()
    if (displayedSource() !== source) throw new Error('O buffer novo não foi ativado no DOM.')
    const domPublishedMs = performance.now() - started
    await new Promise((resolve) => requestAnimationFrame(resolve))
    const nextFrameMs = performance.now() - started
    if (index > 2) observations.push({ ...timings, domPublishedMs, nextFrameMs })
  }
  const fields = ['loadMs', 'decodeMs', 'callbackMs', 'domPublishedMs', 'nextFrameMs']
  if (observations.some((sample) => fields.some((field) =>
    !Number.isFinite(sample[field]) || sample[field] < 0))) {
    throw new Error('O handoff não devolveu marcos temporais válidos.')
  }
  result.textContent = JSON.stringify({ status: 'benchmark', width, height, samples,
    environment: { userAgent: navigator.userAgent, devicePixelRatio,
      hardwareConcurrency: navigator.hardwareConcurrency ?? null },
    sourceGenerationMs,
    timings: Object.fromEntries(fields.map((field) =>
      [field, summary(observations.map((sample) => sample[field]))])) })
} catch (error) {
  result.textContent = JSON.stringify({ status: 'error', message: String(error), stack: error?.stack })
} finally {
  app?.unmount()
}
</script>
