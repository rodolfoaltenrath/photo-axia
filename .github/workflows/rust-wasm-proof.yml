name: Rust WASM proof

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-proof:
    name: Portable proof (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned Rust toolchain and WASM target
        shell: bash
        run: rustup show

      - name: Verify toolchain declarations
        shell: bash
        run: node scripts/check-toolchains.mjs

      - name: Test and lint Rust core
        shell: bash
        run: |
          cargo test --offline --locked --manifest-path rust/axia-pixel-core/Cargo.toml
          cargo clippy --offline --locked --all-targets --manifest-path rust/axia-pixel-core/Cargo.toml -- -D warnings

      - name: Install frontend dependencies
        shell: bash
        working-directory: frontend
        run: npm ci

      - name: Test Rust/WASM and Worker contract
        shell: bash
        working-directory: frontend
        run: npm run test:rust-poc

      - name: Test frontend
        shell: bash
        working-directory: frontend
        run: npm test

      - name: Build and inspect production bundle
        shell: bash
        working-directory: frontend
        run: |
          npm run build
          npm run test:rust-bundle

      - uses: actions/setup-go@v7
        if: runner.os == 'Windows'
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test Go shell on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: go test ./...

      - name: Compare document Canvas oracle on Edge
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch'
        shell: bash
        working-directory: frontend
        run: npm run smoke:document-oracle

      # A hosted Windows runner may lack a usable interactive WebView2 session.
      # Keep this diagnostic manual until it passes on the hosted image.
      - name: Smoke packaged Wails/WebView2 runtime
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch'
        shell: bash
        working-directory: frontend
        run: npm run smoke:rust-wails

      - name: Smoke actual Wails preview handoff and screenshot
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch'
        shell: bash
        working-directory: frontend
        run: npm run smoke:preview-wails
